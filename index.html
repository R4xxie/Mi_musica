<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090d" />
  <meta name="description" content="Mi Música: escucha mis playlists, guarda tus canciones favoritas y descárgalas. Reproductor web rápido y sin anuncios." />
  <title>Mi Música</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    /* Aplica el modo de interfaz guardado antes de pintar (evita parpadeo) */
    (function () {
      try {
        var m = document.cookie.match(/(?:^|; )mm_prefs=([^;]*)/);
        var p = m ? JSON.parse(decodeURIComponent(m[1])) : {};
        if (p.theme === "light" || p.theme === "dark") document.documentElement.setAttribute("data-theme", p.theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
