<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090d" />
  <meta name="description" content="Mi Música: escucha mis playlists, guarda tus canciones favoritas y descárgalas. Reproductor web rápido y sin anuncios." />
  <title>Mi Música</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="app">
    <!-- ---------- Barra lateral ---------- -->
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="logo" href="#/" id="logo-link">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </span>
        <span>Mi Música</span>
      </a>

      <nav class="side-nav">
        <a class="side-link" href="#/" data-route="home" id="nav-home">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>
          Inicio
        </a>
        <a class="side-link" href="#/buscar" data-route="search" id="nav-search">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3m0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10"/></svg>
          Buscar
        </a>
        <a class="side-link" href="#/playlist/favoritos" data-route="playlist:favoritos" id="nav-favorites">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4 6.3 4c2.3 0 3.8 1.3 4.7 2.6C11.9 5.3 13.4 4 15.7 4c4 0 5.9 4.4 4.3 7.7C19.5 16.4 12 21 12 21"/></svg>
          Tus favoritos
          <span class="side-badge" id="fav-count" hidden>0</span>
        </a>
      </nav>

      <div class="side-section">
        <p class="side-heading">Playlists</p>
        <nav id="side-playlists" class="side-playlists" aria-label="Playlists"></nav>
      </div>
    </aside>

    <!-- ---------- Contenido ---------- -->
    <div class="main">
      <header class="topbar">
        <div class="history-btns">
          <button class="round-btn" id="btn-back" type="button" aria-label="Atrás">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m15.4 7.4-1.4-1.4-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
          </button>
          <button class="round-btn" id="btn-forward" type="button" aria-label="Adelante">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m8.6 16.6 1.4 1.4 6-6-6-6-1.4 1.4 4.6 4.6z"/></svg>
          </button>
        </div>

        <form class="search" id="search-form" role="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3m0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10"/></svg>
          <input id="search-input" type="search" placeholder="Buscar canciones, artistas o playlists" aria-label="Buscar" />
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
        </form>
      </header>

      <main id="view" class="view" tabindex="-1" aria-live="polite">
        <p class="status">Cargando…</p>
      </main>
    </div>
  </div>

  <!-- ---------- Reproductor ---------- -->
  <footer class="player" id="player" aria-label="Reproductor">
    <div class="progress" id="progress" role="slider" tabindex="0"
         aria-label="Progreso de la canción"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-track">
        <div class="progress-buffer" id="progress-buffer"></div>
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-thumb" id="progress-thumb"></div>
      </div>
    </div>

    <div class="player-inner">
      <div class="now-playing">
        <img id="player-cover" class="player-cover" alt="" hidden />
        <div class="now-text">
          <p id="player-title" class="now-title">Selecciona una canción</p>
          <p id="player-artist" class="now-artist">&nbsp;</p>
        </div>
        <button id="btn-fav-current" class="icon-btn fav-btn" type="button" aria-label="Añadir a favoritos" aria-pressed="false" hidden>
          <svg class="heart-outline" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M16.5 3c-1.7 0-3.4.8-4.5 2.1A6 6 0 0 0 7.5 3 5.4 5.4 0 0 0 2 8.5c0 3.8 3.4 6.9 8.6 11.5l1.4 1.3 1.4-1.3C18.6 15.4 22 12.3 22 8.5A5.4 5.4 0 0 0 16.5 3m-4.4 15.6-.1.1-.1-.1C7.1 14.2 4 11.4 4 8.5 4 6.5 5.5 5 7.5 5c1.5 0 3 1 3.6 2.4h1.9C13.5 6 15 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.9-3.1 5.7-7.9 10.1"/></svg>
          <svg class="heart-fill" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m12 21.4-1.4-1.3C5.4 15.4 2 12.3 2 8.5A5.4 5.4 0 0 1 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3 5.4 5.4 0 0 1 22 8.5c0 3.8-3.4 6.9-8.6 11.6z"/></svg>
        </button>
      </div>

      <div class="controls">
        <button id="btn-shuffle" class="ctrl ctrl-toggle" type="button" aria-label="Aleatorio" aria-pressed="false" title="Aleatorio (S)">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2z"/></svg>
        </button>
        <button id="btn-prev" class="ctrl" type="button" aria-label="Anterior">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg>
        </button>
        <button id="btn-play" class="ctrl ctrl-main" type="button" aria-label="Reproducir">
          <svg id="icon-play" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" hidden><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="btn-next" class="ctrl" type="button" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <button id="btn-repeat" class="ctrl ctrl-toggle" type="button" aria-label="Repetir: desactivado" data-mode="off" title="Repetir (R)">
          <svg id="icon-repeat" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
          <svg id="icon-repeat-one" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" hidden><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2zm-4-2V9h-1l-2 1v1h1.5v4z"/></svg>
        </button>
      </div>

      <div class="player-right">
        <span class="time"><span id="time-current">0:00</span> / <span id="time-total">0:00</span></span>
        <div class="volume">
          <button id="btn-mute" class="ctrl" type="button" aria-label="Silenciar" title="Silenciar (M)">
            <svg id="icon-vol" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
            <svg id="icon-muted" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
          </button>
          <input id="volume" class="volume-slider" type="range"
                 min="0" max="1" step="0.01" value="0.8" aria-label="Volumen" />
        </div>
      </div>
    </div>
  </footer>

  <!-- ---------- Navegación móvil ---------- -->
  <nav class="mobile-nav" aria-label="Navegación">
    <a href="#/" data-route="home" id="mnav-home">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>
      Inicio
    </a>
    <a href="#/buscar" data-route="search" id="mnav-search">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3m0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10"/></svg>
      Buscar
    </a>
    <a href="#/playlist/favoritos" data-route="playlist:favoritos" id="mnav-favorites">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4 6.3 4c2.3 0 3.8 1.3 4.7 2.6C11.9 5.3 13.4 4 15.7 4c4 0 5.9 4.4 4.3 7.7C19.5 16.4 12 21 12 21"/></svg>
      Favoritos
    </a>
  </nav>

  <!-- ---------- Aviso de cookies ---------- -->
  <div class="cookie-banner" id="cookie-banner" role="dialog" aria-live="polite" aria-label="Aviso de cookies" hidden>
    <span class="cookie-emoji" aria-hidden="true">🍪</span>
    <p>
      Usamos cookies propias para recordar <strong>tus favoritos</strong>, lo último que escuchaste
      y tus preferencias en este navegador. No se comparten con nadie.
    </p>
    <button class="btn btn-primary" id="cookie-accept" type="button">Entendido</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/zip.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
